version: '3.8'

services:
  # PHP 7.4 FPM Container (Native runtime for Laravel 5.8)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omdb_app
    restart: unless-stopped
    working_dir: /var/www/html/omdb-movie-list
    volumes:
      - .:/var/www/html/omdb-movie-list
    extra_hosts:
      # Memungkinkan container PHP mengakses MySQL yang berjalan di host server
      - "host.docker.internal:host-gateway"
    networks:
      - omdb_network

  # Nginx Web Server Container
  web:
    image: nginx:alpine
    container_name: omdb_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html/omdb-movie-list
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - omdb_network

networks:
  omdb_network:
    driver: bridge
